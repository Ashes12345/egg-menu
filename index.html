<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>洛克王国 · 孵蛋交换菜单</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    background: linear-gradient(160deg, #f7f8fc 0%, #eef1f9 100%);
    color: #2d3350;
    min-height: 100vh;
  }
  .page { max-width: 1060px; margin: 0 auto; padding: 24px 20px 80px; }

  .header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .title { font-size: 26px; font-weight: 700; letter-spacing: 1px; }
  .title .emoji { margin-right: 8px; }
  .subtitle { color: #8a90a8; font-size: 13px; margin-top: 6px; }
  .stat {
    background: #fff; border: 1px solid #e6e9f2; border-radius: 999px;
    padding: 6px 14px; font-size: 13px; color: #5a6080; box-shadow: 0 1px 2px rgba(30,40,90,.04);
  }
  .stat b { color: #2d3350; }

  .toolbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: rgba(247,248,252,.9); backdrop-filter: blur(8px);
    padding: 14px 0; margin-top: 18px; border-bottom: 1px solid rgba(230,233,242,.8);
  }
  .search { flex: 1; min-width: 200px; position: relative; }
  .search input {
    width: 100%; padding: 10px 14px 10px 38px; font-size: 14px;
    border: 1px solid #dde1ee; border-radius: 12px; background: #fff;
    outline: none; transition: border .15s, box-shadow .15s;
  }
  .search input:focus { border-color: #7c8cf8; box-shadow: 0 0 0 3px rgba(124,140,248,.15); }
  .search .icon {
    position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
    color: #a5abc4; font-size: 15px; pointer-events: none;
  }
  .btn {
    border: 1px solid #dde1ee; background: #fff; color: #4a5072;
    font-size: 13px; padding: 9px 14px; border-radius: 12px; cursor: pointer;
    transition: background .15s, border .15s, transform .1s; white-space: nowrap;
  }
  .btn:hover { background: #f2f4fb; border-color: #c9cfe4; }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: #6b7bf7; border-color: #6b7bf7; color: #fff; }
  .btn.primary:hover { background: #5a6af0; }
  .btn.warn { background: #f59e0b; border-color: #f59e0b; color: #fff; }
  .btn.warn:hover { background: #d97706; }

  .section { margin-top: 20px; }
  .group-head {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 16px; border-radius: 14px; cursor: pointer;
    border: 1px solid; user-select: none;
    transition: filter .15s;
  }
  .group-head:hover { filter: brightness(.97); }
  .group-head .gdot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .group-head .gname { font-size: 15px; font-weight: 700; }
  .group-head .gcount {
    font-size: 12px; padding: 2px 10px; border-radius: 999px;
    background: rgba(255,255,255,.75);
  }
  .group-head .chev {
    margin-left: auto; font-size: 12px; opacity: .7;
    transition: transform .2s;
  }
  .section.collapsed .chev { transform: rotate(-90deg); }
  .group-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr));
    gap: 10px; padding: 12px 2px 0;
  }
  .section.collapsed .group-grid { display: none; }

  .card {
    background: #fff; border: 1px solid #e6e9f2; border-radius: 14px;
    padding: 16px 14px 15px; cursor: pointer; position: relative;
    transition: transform .15s, box-shadow .15s, border-color .15s;
    box-shadow: 0 1px 3px rgba(30,40,90,.05);
  }
  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(40,55,130,.10);
    border-color: #c9cfe4;
  }
  .card:active { transform: translateY(-1px) scale(.98); }
  .card .idx { position: absolute; top: 9px; right: 12px; font-size: 12px; color: #b6bcd4; }
  .card .pet-img {
    display: inline-block; width: 64px; height: 64px; margin: 4px 2px 6px;
    object-fit: contain; border-radius: 10px; vertical-align: middle;
    background: radial-gradient(circle at 50% 40%, #f4f7ff 0%, #e9eefb 100%);
  }
  .card .pet-img:first-child { width: 84px; height: 84px; }
  .card .pet-imgs { text-align: center; position: relative; display: inline-block; }
  .card .count-badge {
    position: absolute; right: -4px; bottom: 0; z-index: 1;
    min-width: 20px; height: 20px; padding: 0 5px;
    background: #e5484d; color: #fff; font-size: 12px; font-weight: 700;
    border-radius: 999px; border: 2px solid #fff; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .card .pet-img.broken { visibility: hidden; }
  .card .pet-no {
    display: block; text-align: center; font-size: 11px; color: #a0a7c3;
    margin-bottom: 2px; letter-spacing: .5px;
  }
  .card .name {
    font-size: 15px; font-weight: 600; color: #2d3350;
    word-break: break-all; line-height: 1.4; text-align: center;
  }
  .card .copy-hint {
    position: absolute; left: 0; right: 0; bottom: 0; height: 34px;
    background: linear-gradient(to top, rgba(107,123,247,.12), transparent);
    border-radius: 0 0 14px 14px;
    display: flex; align-items: flex-end; justify-content: center;
    font-size: 11px; color: #6b7bf7; padding-bottom: 8px;
    opacity: 0; transition: opacity .15s;
  }
  .card:hover .copy-hint { opacity: 1; }
  .card .note-dot {
    position: absolute; top: 8px; left: 12px; width: 8px; height: 8px;
    border-radius: 50%; background: #6b7bf7; opacity: .8;
  }
  .card .note-btn {
    position: absolute; top: 6px; right: 30px; border: none; background: none;
    font-size: 14px; cursor: pointer; opacity: .55; padding: 2px;
    transition: opacity .15s; border-radius: 6px; z-index: 1;
  }
  .card:hover .note-btn { opacity: 1; }
  .card .note-btn:hover { background: #eef1fb; }
  .group-head .g-note-btn {
    border: none; background: none; font-size: 13px; cursor: pointer;
    opacity: .55; padding: 2px; border-radius: 6px; transition: opacity .15s;
  }
  .group-head:hover .g-note-btn { opacity: 1; }
  .group-head .g-note-btn:hover { background: rgba(255,255,255,.8); }
  .group-head .g-dot {
    width: 8px; height: 8px; border-radius: 50%; background: #6b7bf7;
    opacity: .8; flex-shrink: 0;
  }

  .empty {
    text-align: center; color: #9aa0ba;
    padding: 60px 0; font-size: 14px;
  }
  .empty .big { font-size: 40px; margin-bottom: 10px; }

  .hint-bar {
    background: #eef1fb; border: 1px solid #dde3f7; color: #5a6390;
    font-size: 12.5px; border-radius: 12px; padding: 10px 14px; margin-top: 24px;
    line-height: 1.7;
  }
  .footer {
    margin-top: 26px; text-align: center; color: #a2a8c2; font-size: 12px; line-height: 1.8;
  }

  .toast {
    position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%) translateY(20px);
    background: #2d3350; color: #fff; font-size: 13px; padding: 10px 20px;
    border-radius: 999px; opacity: 0; pointer-events: none; z-index: 100;
    transition: opacity .2s, transform .2s; max-width: 80vw;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .overlay {
    position: fixed; inset: 0; background: rgba(30,35,60,.35); z-index: 50;
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .overlay.show { display: flex; }
  .dialog {
    background: #fff; border-radius: 18px; width: 100%; max-width: 620px;
    padding: 22px; box-shadow: 0 20px 60px rgba(20,30,70,.25);
  }
  .dialog h3 { font-size: 17px; margin-bottom: 6px; }
  .dialog .desc { font-size: 12.5px; color: #8a90a8; margin-bottom: 12px; line-height: 1.7; }
  .dialog input[type="password"] {
    width: 100%; padding: 11px 14px; font-size: 14px;
    border: 1px solid #dde1ee; border-radius: 12px; outline: none; margin-bottom: 14px;
  }
  .dialog input[type="password"]:focus { border-color: #7c8cf8; box-shadow: 0 0 0 3px rgba(124,140,248,.15); }
  .dialog textarea {
    width: 100%; height: 320px; resize: vertical; padding: 12px; font-size: 13px;
    font-family: Consolas, "Courier New", monospace; line-height: 1.7;
    border: 1px solid #dde1ee; border-radius: 12px; outline: none;
  }
  .dialog textarea:focus { border-color: #7c8cf8; box-shadow: 0 0 0 3px rgba(124,140,248,.15); }
  .dialog .btns { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 14px; }
  .dialog .btns .right { display: flex; gap: 10px; }
  .dialog .add-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .dialog .add-row input {
    flex: 1; padding: 9px 12px; font-size: 13px;
    border: 1px solid #dde1ee; border-radius: 10px; outline: none;
  }
  .dialog .add-row input:focus { border-color: #7c8cf8; }
  .dialog .add-row select {
    padding: 9px 10px; font-size: 13px;
    border: 1px solid #dde1ee; border-radius: 10px; outline: none; background: #fff;
  }
  .dialog .add-row select:focus { border-color: #7c8cf8; }
  .dialog .add-row .btn { flex-shrink: 0; }
  .admin-list { max-height: 320px; overflow-y: auto; margin-top: 2px; }
  .admin-group-row {
    border: 1px solid #e6e9f2; border-radius: 12px; padding: 10px;
    margin-bottom: 10px; background: #fbfcff;
  }
  .admin-group-row .ag-head { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .admin-group-row .ag-name {
    flex: 1; padding: 7px 10px; font-size: 13px; font-weight: 600;
    border: 1px solid #dde1ee; border-radius: 10px; outline: none;
  }
  .admin-group-row .ag-name:focus { border-color: #7c8cf8; }
  .admin-group-row .ag-eggs { display: flex; flex-wrap: wrap; gap: 8px; }
  .admin-group-row .ag-egg {
    display: flex; align-items: center; gap: 4px;
    background: #fff; border: 1px solid #e6e9f2; border-radius: 10px;
    padding: 4px 6px;
  }
  .admin-group-row .ag-egg input {
    border: 1px solid #e6e9f2; border-radius: 8px; padding: 5px 6px;
    font-size: 13px; outline: none; width: 88px;
  }
  .admin-group-row .ag-egg input:focus { border-color: #7c8cf8; }
  .admin-group-row .ag-egg .ag-count { width: 52px; text-align: center; }
  .admin-group-row .ag-egg .ag-del {
    border: none; background: none; color: #c0c6dd; font-size: 13px;
    cursor: pointer; padding: 2px 4px; border-radius: 6px;
  }
  .admin-group-row .ag-egg .ag-del:hover { color: #e5484d; background: #fdecec; }
  .admin-group-row .ag-add {
    border: 1px dashed #c9cfe4; background: none; color: #6b7bf7;
    font-size: 12px; padding: 6px 12px; border-radius: 10px; cursor: pointer;
    margin-top: 8px;
  }
  .admin-group-row .ag-add:hover { background: #eef1fb; }
  .admin-list .ag-new {
    width: 100%; border: 1px dashed #c9cfe4; background: none; color: #6b7bf7;
    font-size: 13px; padding: 10px; border-radius: 12px; cursor: pointer; margin-top: 2px;
  }
  .admin-list .ag-new:hover { background: #eef1fb; }

  @media (max-width: 640px) {
    .title { font-size: 21px; }
    .group-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
  }
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <div>
      <div class="title"><span class="emoji">🥚</span>洛克王国 · 孵蛋交换菜单</div>
      <div class="subtitle">点击卡片可复制宠物名，直接发给对方交换</div>
    </div>
    <div class="stat">共 <b id="statTotal">0</b> 枚蛋 · <b id="statGroups">0</b> 个分组</div>
  </div>

  <div class="toolbar">
    <div class="search">
      <span class="icon">🔍</span>
      <input id="searchInput" type="text" placeholder="搜索宠物名或分组…" autocomplete="off">
    </div>
    <button class="btn" id="foldBtn">全部折叠</button>
    <button class="btn" id="resetBtn">恢复初始</button>
    <button class="btn warn" id="adminBtn">⚙ 管理数据</button>
    <button class="btn primary" id="exportBtn">导出备份</button>
  </div>

  <div id="sections"></div>
  <div class="empty" id="emptyBox" style="display:none">
    <div class="big">🥚</div>没有找到匹配的蛋
  </div>

  <div class="hint-bar">
    💡 操作提示：点击卡片复制名字 → 粘贴给对方即可发起交换。点分组标题可折叠/展开。
    数据实时从云端加载，管理员可通过「⚙ 管理数据」在线添加/删除。数据仅管理员能修改，访客看到的是只读版本。
  </div>

  <div class="footer">洛克王国孵蛋菜单 · 交换愉快~</div>
</div>

<div class="toast" id="toast"></div>

<div class="overlay" id="overlay">
  <div class="dialog" id="dialog"></div>
</div>

<script>
(function () {
  var STORAGE_KEY = 'roco_egg_menu_v2';
  var API_URL = '';
  var PALETTE = [
    { dot: '#f59e0b', bg: '#fef3d6', bd: '#f7dfa8', fg: '#a16207' },
    { dot: '#3b82f6', bg: '#e6effe', bd: '#c3d9fb', fg: '#1d4ed8' },
    { dot: '#a855f7', bg: '#f3e9fd', bd: '#e2ccf9', fg: '#7e22ce' },
    { dot: '#ec4899', bg: '#fce8f3', bd: '#f6c9e1', fg: '#be185d' },
    { dot: '#10b981', bg: '#e3f8ef', bd: '#bfebd9', fg: '#047857' },
    { dot: '#06b6d4', bg: '#e2f6fb', bd: '#bcebf5', fg: '#0e7490' },
    { dot: '#f43f5e', bg: '#fcebee', bd: '#f7c7d1', fg: '#be123c' },
    { dot: '#8b5cf6', bg: '#eee9fe', bd: '#d8ccfb', fg: '#6d28d9' },
    { dot: '#84cc16', bg: '#f0f9e2', bd: '#dcf0bd', fg: '#4d7c0f' },
    { dot: '#f97316', bg: '#fdeee0', bd: '#f8d8ba', fg: '#c2410c' },
    { dot: '#14b8a6', bg: '#e2f8f4', bd: '#bfede4', fg: '#0f766e' },
    { dot: '#64748b', bg: '#eef1f5', bd: '#d6dbe6', fg: '#475569' }
  ];

  var state = { groups: load(), query: '', collapsed: {}, notes: {} };

  var ALIASES = {
    '火冰乌达': '乌达（极昼的样子）',
    '冰乌达': '乌达（极夜的样子）',
    '海葵': '加油海葵',
    '圣剑': '圣剑骑士',
    '春夏秋冬鸟': ['岚鸟（春天的样子）', '岚鸟（夏天的样子）', '岚鸟（秋天的样子）', '岚鸟'],
    '春鸟': '岚鸟（春天的样子）',
    '夏鸟': '岚鸟（夏天的样子）',
    '秋鸟': '岚鸟（秋天的样子）',
    '冬鸟': '岚鸟',
    '夏鸟': '岚鸟（夏天的样子）',
    '秋鸟': '岚鸟（秋天的样子）',
    '海豹': '海豹船长',
    '固执海豹': '海豹船长',
    '急躁海豹': '海豹船长',
    '帕帕': '帕帕斯卡',
    '草鹿': '针叶巡林',
    '火狗': '音速犬',
    '红钻': '恶魔红钻',
    '雪熊': '月牙雪熊',
    '黑棋': '棋骑士（黑子）',
    '冰猪': '呼呼猪',
    '木偶': '牵线木偶',
    '菠萝': '嗜波螺',
    '骨龙': '寂灭骨龙',
    '平和骨龙': '寂灭骨龙',
    '大象': '巨鼓象',
    '柴薪虫': '燃薪虫',
    '蚊子': '窃光蚊',
    '水母': '翡翠水母',
    '松鼠': '绿耳松鼠',
    '鲸鱼': '深蓝鲸',
    '上下弦': '刺轮砣（上弦的样子）',
    '鼠獭': '小鼠獭',
    '小萝': '厉毒小萝',
    '草沙冰卡': '卡卡虫（草地附近的样子）',
    '草卡': '卡卡虫（草地附近的样子）',
    '冰卡': '卡卡虫（雪山附近的样子）',
    '沙卡': '卡卡虫（沙地附近的样子）',
    '天鹅': '蓝珠天鹅',
    '莎莎': '彩蝶鲨',
    '长绒': '捕尘长绒',
    '小丑': '小丑豆豆',
    '月光狮': '星光狮（月光能量的样子）',
    '星光狮': '星光狮（星光能量的样子）',
    '蜂后': '花魁蜂后',
    '狮鹫': '小狮鹫（高山地的样子）',
    '开朗狮鹫': '小狮鹫（高山地的样子）',
    '白粉蹦蹦': '蹦蹦种子（短毛球形态）',
    '黑猫': '小黑猫',
    '迪迪': '炫光迪迪',
    '电羊': '电球咩咩',
    '独角兽': '小独角兽',
    '急躁混聪明独角兽': '小独角兽',
    '绿枝枝': '海枝枝（翠绿纶布）',
    '蓝枝枝': '海枝枝（碧蓝珊瑚）',
    '鳗鱼': '闪电鳗鱼',
    '梦游': '梦游（穿旧睡衣的样子）',
    '睡帽鸭': '鸭吉吉（起来鸭）',
    '雪娃': '雪娃娃',
    '火马': '火红尾',
    '化蝶': '化蝶（平常的样子）',
    '短绒': '食尘短绒',
    '亚龙': '伊兰亚龙',
    '胆小依兰龙': '伊兰龙',
    '急躁混胆小依兰龙': '伊兰龙'
  };
  var dexList = [];
  var dexLoaded = false;

  function loadDex() {
    fetch('dex.json?t=' + Date.now())
      .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error('bad')); })
      .then(function (arr) {
        dexList = Array.isArray(arr) ? arr : [];
        dexLoaded = true;
        render();
      })
      .catch(function () {
        dexLoaded = true;
        render();
      });
  }

  function dexFind(name) {
    var target = ALIASES[name] || name;
    if (typeof target === 'string') target = [target];
    var hits = [];
    for (var i = 0; i < target.length; i++) {
      for (var j = 0; j < dexList.length; j++) {
        if (dexList[j].name === target[i]) hits.push(dexList[j]);
      }
    }
    return hits.length ? hits : null;
  }

  function petNo(name) {
    var d = dexFind(name);
    return d ? parseInt(d[0].no, 10) : 0;
  }

  function sortedNames(g) {
    return g.names.map(function (n) { return { name: n, no: petNo(eggBase(n)) }; })
      .sort(function (a, b) {
        if (a.no && b.no) return a.no - b.no;
        if (a.no) return -1;
        if (b.no) return 1;
        return 0;
      })
      .map(function (x) { return x.name; });
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var arr = JSON.parse(raw);
        if (Array.isArray(arr) && arr.length) return arr;
      }
    } catch (e) {}
    return parseLines(DEFAULT_TEXT);
  }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.groups)); } catch (e) {}
  }

  var DEFAULT_TEXT = [

  ].join('\n');

  function splitNames(s) {
    return s.split(/[|，,、]/).map(function (t) { return t.trim(); }).filter(Boolean);
  }

  function eggBase(name) {
    return name.replace(/[×x](\d+)$/, '');
  }

  function eggCount(name) {
    var m = name.match(/[×x](\d+)$/);
    return m ? parseInt(m[1], 10) : 0;
  }

  function eggName(name) {
    var c = eggCount(name);
    return c > 0 ? eggBase(name) + '×' + c : eggBase(name);
  }

  function parseLines(text) {
    var groups = [];
    var current = null;
    text.split(/\r?\n/).forEach(function (raw) {
      var line = raw.trim();
      if (!line) return;
      var m = line.match(/^(.+?)[：:]\s*(.*)$/);
      if (m) {
        current = { group: m[1].trim(), names: splitNames(m[2]) };
        if (current.names.length) groups.push(current);
        else current = null;
      } else {
        var names = splitLinesNames(line);
        if (!current) {
          current = { group: '其他', names: [] };
          groups.push(current);
        }
        current.names = current.names.concat(names);
      }
    });
    return groups.filter(function (g) { return g.names.length; });
  }

  function splitLinesNames(line) {
    var parts = line.split('|');
    var names = [];
    parts.forEach(function (p) {
      var mm = p.match(/^(.+?)[：:]\s*(.*)$/);
      if (mm) names = names.concat(splitNames(mm[2]));
      else names = names.concat(splitNames(p));
    });
    return names;
  }

  function serialize() {
    return state.groups.map(function (g) {
      return g.group + '：' + g.names.map(eggName).join('，');
    }).join('\n');
  }

  function groupColor(name) {
    var h = 0;
    for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
    return PALETTE[h % PALETTE.length];
  }

  function esc(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function filteredGroups() {
    var q = state.query.trim().toLowerCase();
    if (!q) return state.groups.map(function (g) { return { group: g.group, names: sortedNames(g) }; });
    return state.groups.map(function (g) {
      var matchGroup = g.group.toLowerCase().indexOf(q) !== -1;
      if (matchGroup) return { group: g.group, names: sortedNames(g) };
      var names = g.names.filter(function (n) { return eggBase(n).toLowerCase().indexOf(q) !== -1; });
      return { group: g.group, names: names };
    }).filter(function (g) { return g.names.length; });
  }

      ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      toast('已复制：' + text);

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        toast('已复制：' + text);
      }).catch(fallback);
    } else {
      fallback();
    }
  }

  function getPw() {

  function b64encode(buf) {
    var bytes = new Uint8Array(buf);
    var bin = '';
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }

  function b64decode(b64) {
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes.buffer;
  }

  function deriveKey(pw, saltBuf) {
    var enc = new TextEncoder();
    return crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey'])
      .then(function (km) {
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: saltBuf, iterations: 300000, hash: 'SHA-256' },
          km,
          { name: 'AES-GCM', length: 256 },
          false,
          ['encrypt', 'decrypt']
        );
      });
  }

  function encryptNotes(pw, notesObj) {
    var salt = crypto.getRandomValues(new Uint8Array(16));
    var iv = crypto.getRandomValues(new Uint8Array(12));
    return deriveKey(pw, salt).then(function (key) {
      var plain = new TextEncoder().encode(JSON.stringify(notesObj));
      return crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, plain).then(function (cipher) {
        return JSON.stringify({
          v: 1,
          s: b64encode(salt),
          i: b64encode(iv),
          d: b64encode(cipher)
        });
      });
    });
  }

  function decryptNotes(pw, payload) {
    var p = JSON.parse(payload);
    return deriveKey(pw, b64decode(p.s)).then(function (key) {
      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64decode(p.i) }, key, b64decode(p.d));
    }).then(function (plain) {
      return JSON.parse(new TextDecoder().decode(plain));
    });
  }

  function loadNotes() {
    var pw = getPw();
    fetch('/api/notes?t=' + Date.now())
      .then(function (r) { return r.ok ? r.text() : Promise.reject(new Error('bad')); })
      .then(function (text) {
        if (!text.trim()) {
          state.notes = {};
          render();
          return;
        }
        return decryptNotes(pw, text).then(function (obj) {
          state.notes = obj || {};
          render();
        });
      })
      .catch(function () {
        state.notes = {};
        render();
        if (getPw()) toast('备注无法解密（可能改过密码）');
      });
  }

  function adminGroups() {
    var set = [];
    state.groups.forEach(function (g) {
      var found = false;
      set.forEach(function (x) { if (x === g.group) found = true; });
      if (!found) set.push(g.group);
    });
    return set;
  }

    var pw = (document.getElementById('pwInput').value || '').trim();
    if (!pw) { toast('请输入管理密码'); return; }
    fetch('/api/check', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + pw }
    }).then(function (r) {
      if (r.status === 200) {
        sessionStorage.setItem('egg_admin_pw', pw);
        render();
        showAdminEditor();
        loadNotes();
      } else {
        toast('密码错误，无法进入管理');
        document.getElementById('pwInput').value = '';
        document.getElementById('pwInput').focus();
      }
    }).catch(function () {
      toast('网络错误，请稍后重试');
    });

  var noteTarget = null;

  function noteKey(type, group, name) {
    return type === 'group' ? '#' + group : group + '/' + eggBase(name);
  }

  function showNoteDialog(type, group, name) {
    noteTarget = { type: type, group: group, name: name };
    var key = noteKey(type, group, name);
    var title = type === 'group' ? '📝 分组备注' : '📝 私人备注';
    var desc = type === 'group'
      ? esc(group) + ' —— 整组备注，用管理密码加密保存，别人看不到。点击「保存并发布」后生效。'
      : esc(name) + '（' + esc(group) + '）—— 备注用管理密码加密保存，别人看不到。点击「保存并发布」后生效。';
    openDialog(
      '<h3>' + title + '</h3>' +
      '<div class="desc">' + desc + '</div>' +
      '<textarea id="noteText" spellcheck="false">' + esc(state.notes[key] || '') + '</textarea>' +

  window.app_saveNote = function () {
    if (!noteTarget) return;
    var key = noteKey(noteTarget.type, noteTarget.group, noteTarget.name);
    var val = document.getElementById('noteText').value.trim();
    if (val) state.notes[key] = val;
    else delete state.notes[key];

  function publishAll(successMsg) {
    var pw = getPw();
    if (!pw) {
      toast('未登录，无法发布');
      showAdminLogin();
      return;
    }
    var text = serialize();
    fetch(API_URL + '/api/data', {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8', 'Authorization': 'Bearer ' + pw },
      body: text
    }).then(function (r) {
      if (r.status === 401) {
        sessionStorage.removeItem('egg_admin_pw');
        toast('密码错误或已失效，请重新登录');
        showAdminLogin();
        return null;
      }
      if (!r.ok) {
        toast('发布失败（' + r.status + '），请稍后重试');
        return null;
      }
      save();
      render();
      return encryptNotes(pw, state.notes).then(function (payload) {
        return fetch(API_URL + '/api/notes', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + pw },
          body: payload
        });
      });
    }).then(function (rn) {
      if (rn === null) return;
      if (!rn.ok) toast('菜单已发布，但备注发布失败（' + rn.status + '）');
      else toast(successMsg);
    }).catch(function () {
      toast('网络错误，无法连接服务器');
    });

  window.app_publish = function () {
    var lines = [];
    document.querySelectorAll('.admin-group-row').forEach(function (row) {
      var g = row.querySelector('.ag-head .ag-name').value.trim();
      if (!g) return;
      var names = [];
      row.querySelectorAll('.ag-egg').forEach(function (egg) {
        var n = egg.querySelector('.ag-name').value.trim();
        if (!n) return;
        var c = parseInt(egg.querySelector('.ag-count').value, 10);
        if (isNaN(c) || c < 0) c = 0;
        names.push(c > 0 ? n + '×' + c : n);
      });
      if (names.length) lines.push(g + '：' + names.join('，'));
    });
    if (!lines.length) { toast('还没有任何蛋，请先添加'); return; }
    var list = parseLines(lines.join('\n'));
    if (!list.length) { toast('数据格式不对，请检查'); return; }
    state.groups = list;
    state.collapsed = {};
    closeDialog();
    toast('正在发布…');
    publishAll('菜单和备注都已发布！');

    render();
  });

  render();
  loadDex();

  function loadRemote() {
    return fetch('/api/data?t=' + Date.now())
      .then(function (r) {
        if (!r.ok) throw new Error('bad status');
        return r.text();
      })
      .then(function (text) {
        var list = parseLines(text);
        if (list.length) {
          state.groups = list;
          state.collapsed = {};
          save();
          render();
        }
      });
  }

  loadRemote().catch(function () {
    fetch('data.txt?t=' + Date.now())
      .then(function (r) { return r.ok ? r.text() : Promise.reject(); })
      .then(function (text) {
        var list = parseLines(text);
        if (list.length) {
          state.groups = list;
          state.collapsed = {};
          save();
          render();
        }
      })
      .catch(function () {});
  });
})();
</script>
</body>
</html>
